<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muscle Mechanic – Membership Manager</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,2 28,9 28,23 16,30 4,23 4,9' fill='%23ffd400'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23000'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050505; --panel:#0f0f0f; --panel2:#171717; --line:#262626; --edge:rgba(255,226,120,.16); --hi:rgba(255,236,160,.08);
  --text:#f4f4ee; --mute:#9b9b92;
  --y:#ffd400; --ydim:#c9a800;
  --red:#ff5a47; --orange:#ff9d1c; --blue:#7db2ff; --green:#3ddc84;
  --r:6px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1100px 520px at 10% -10%,rgba(255,212,0,.10),transparent 60%),radial-gradient(900px 500px at 100% 0,rgba(255,255,255,.045),transparent 55%),var(--bg);background-attachment:fixed;color:var(--text);font:15px/1.45 'Barlow',system-ui,'Segoe UI',Arial,sans-serif;min-height:100vh}
h1,h2,h3{font-family:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:0;font-weight:800;line-height:1.05}
h1{font-size:40px} h2{font-size:26px} h3{font-size:20px}
button{font:inherit;cursor:pointer}
*{scrollbar-width:thin;scrollbar-color:#333 #0a0a0a}
a{color:var(--y)}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}

.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,#141414 0%,#080808 60%,#050505 100%);border-right:1px solid rgba(255,226,120,.12);box-shadow:inset -1px 0 0 rgba(255,255,255,.03);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:22px 18px 18px;display:flex;gap:12px;align-items:center}
.brand svg{flex:none}
.brand .nm{font-family:'Big Shoulders Display',Impact,sans-serif;font-weight:900;font-size:28px;line-height:.92;text-transform:uppercase}
.brand .nm span{display:block}
.brand .nm .y{color:var(--y)}
.hazard{height:3px;background:linear-gradient(90deg,var(--y),rgba(255,212,0,.2) 70%,transparent)}
.nav{padding:14px 0;flex:1}
.nav button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;color:var(--mute);padding:11px 16px;font-weight:600;font-size:15px}
.nav button:hover{color:var(--text);background:var(--panel2)}
.nav button.on{color:var(--y);background:linear-gradient(90deg,rgba(255,212,0,.14),rgba(255,212,0,0) 85%);border-left-color:var(--y)}
.nav .bd{background:var(--red);color:#000;border-radius:99px;font-size:12px;font-weight:700;padding:0 7px;min-width:20px;text-align:center}
.side .foot{padding:14px 18px;color:var(--mute);font-size:12px;border-top:1px solid var(--line)}

.main{padding:26px 34px 60px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top .sub{color:var(--mute);margin-top:6px}

.btn{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0));color:var(--text);border:1px solid #3a3a3a;border-radius:var(--r);padding:8px 14px;font-weight:600}
.btn{text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--y);color:var(--y)}
.btn.primary{background:linear-gradient(180deg,#ffe873 0%,#ffd400 52%,#d4ac00 100%);border-color:#ffe97a;color:#000;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 4px 14px rgba(255,212,0,.14)}
.btn.primary:hover{filter:brightness(1.08);color:#000}
.btn.danger{color:var(--red);border-color:#5a2a25}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.wa{color:var(--green);border-color:#1f4a33}
.btn.wa:hover{border-color:var(--green);color:var(--green)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* dashboard */
.hero{position:relative;overflow:hidden;color:var(--text);display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding:24px 28px 20px;border:1px solid var(--edge);border-bottom:0;border-radius:var(--r) var(--r) 0 0;background:linear-gradient(115deg,rgba(255,226,120,.17) 0%,rgba(255,212,0,.04) 24%,transparent 42%),linear-gradient(180deg,#1b1b1b,#090909)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.055) 47%,rgba(255,236,160,.04) 52%,transparent 58%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .big{font-family:'Big Shoulders Display',Impact,sans-serif;font-weight:900;font-size:clamp(72px,12vw,132px);line-height:.85;color:#ffd400;background:linear-gradient(180deg,#fff6bf 0%,#ffd400 46%,#9c7b00 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 8px 20px rgba(255,212,0,.16))}
.hero .lbl{font-weight:600;font-size:16px;color:var(--mute);margin-bottom:6px}
.hero .side2{text-align:right;font-weight:500;font-size:15px;line-height:1.6;color:var(--mute)}
.hero .side2 b{font-family:'Big Shoulders Display',Impact,sans-serif;font-size:26px;font-weight:800;color:var(--text)}
.herostripe{height:3px;background:linear-gradient(90deg,var(--y),rgba(255,212,0,.25) 55%,transparent);border-radius:0 0 var(--r) var(--r)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-bottom:1px solid var(--line);margin:0 0 26px}
.stat{padding:16px 16px 16px 0;border-right:1px solid var(--line);padding-left:16px;background:none;border-top:0;border-bottom:0;border-left:0;color:inherit;text-align:left}
.stat:first-child{padding-left:0}
.stat:last-child{border-right:0}
button.stat:hover .v{color:var(--y)}
.stat .v{font-family:'Big Shoulders Display',Impact,sans-serif;font-weight:800;font-size:36px;line-height:1}
.stat .k{color:var(--mute);font-size:13px;margin-top:4px}
.cols2{display:grid;grid-template-columns:1.3fr 1fr;gap:26px;margin-bottom:26px}
.panel{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(255,226,120,.06) 0%,transparent 30%),linear-gradient(180deg,#141414,#0a0a0a);border:1px solid rgba(255,255,255,.07);border-radius:var(--r);padding:18px;box-shadow:inset 0 1px 0 var(--hi),0 12px 30px rgba(0,0,0,.45)}
.panel h3{margin-bottom:14px}
.panel .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.panel .hd h3{margin:0}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mute);font:12px 'Barlow',sans-serif}
.chart .val{fill:var(--text);font-weight:600}
.mix{display:grid;gap:12px}
.mix .r{display:grid;grid-template-columns:90px 1fr 34px;gap:10px;align-items:center}
.mix .bar{height:14px;background:var(--panel2);border-radius:2px;overflow:hidden}
.mix .bar i{display:block;height:100%;background:linear-gradient(90deg,#4d4420,#c9a82a)}
.mix .n{text-align:right;font-weight:700}

/* tables */
.tw{overflow-x:auto;border:1px solid rgba(255,255,255,.07);border-radius:var(--r);background:linear-gradient(180deg,#131313,#0a0a0a);box-shadow:inset 0 1px 0 var(--hi),0 12px 30px rgba(0,0,0,.4)}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600;font-size:13px;background:#141414;position:sticky;top:0}
th.s{cursor:pointer;user-select:none}
th.s:hover{color:var(--y)}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--panel2)}
td.num,th.num{text-align:right}
td .sm2{color:var(--mute);font-size:12px;display:block}
td a.nm{color:var(--text);font-weight:700;text-decoration:none;background:none;border:0;padding:0;cursor:pointer;font-size:15px}
td a.nm:hover{color:var(--y)}
.empty{padding:34px;text-align:center;color:var(--mute)}
.chip{display:inline-block;padding:1px 9px;border-radius:3px;font-size:12px;font-weight:700;border:1px solid}
.chip.active,.chip.live{color:var(--green);border-color:#1f4a33;background:rgba(61,220,132,.1)}
.chip.expiring,.chip.scheduled{color:var(--orange);border-color:#5a3a0e;background:rgba(255,157,28,.1)}
.chip.expired,.chip.ended{color:var(--red);border-color:#5a2a25;background:rgba(255,90,71,.1)}
.chip.frozen,.chip.upcoming{color:var(--blue);border-color:#27415f;background:rgba(125,178,255,.1)}
.chip.paused,.chip.off{color:var(--mute);border-color:#3a3a3a}

.bar2{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.bar2 input[type=search]{flex:1;min-width:200px}
.bar2 select{width:auto}
.list{display:grid;gap:0}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.li:last-child{border-bottom:0}
.li .sub{color:var(--mute);font-size:13px}

/* forms */
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px;font-weight:500}
input,select,textarea{width:100%;background:#080808;border:1px solid var(--line);color:var(--text);padding:9px 10px;border-radius:var(--r);font:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--y);outline:none;box-shadow:0 0 0 2px rgba(255,212,0,.25)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--y)}
.chk{display:flex;align-items:center;gap:8px;color:var(--text);font-size:14px;margin:0}
textarea{min-height:70px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.g1{margin-bottom:12px}
.plansel{display:flex;gap:8px;flex-wrap:wrap}
.sum{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:6px 0 14px}
.sum .l{display:flex;justify-content:space-between;padding:3px 0;color:var(--mute)}
.sum .l b{color:var(--text);font-weight:600}
.sum .l.t{border-top:1px dashed #444;margin-top:6px;padding-top:8px;color:var(--text);font-size:18px}
.sum .l.t b{color:var(--y);font-family:'Big Shoulders Display',Impact,sans-serif;font-size:30px;font-weight:800}
.hint{color:var(--mute);font-size:13px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 18px;margin:14px 0}
.kv div span{display:block;color:var(--mute);font-size:12px}
.kv div b{font-size:16px}

/* offers */
.offer{border:1px solid rgba(255,255,255,.07);border-left:4px solid #555;background:linear-gradient(135deg,rgba(255,226,120,.05),transparent 30%),linear-gradient(180deg,#131313,#0a0a0a);border-radius:var(--r);padding:14px 16px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.offer.live{border-left-color:var(--green)}
.offer.ended{border-left-color:var(--red);opacity:.75}
.offer.paused{border-left-color:#555;opacity:.8}
.offer.scheduled{border-left-color:var(--orange)}
.offer .meta{color:var(--mute);font-size:13px;margin-top:4px}

/* check-in */
.ci{display:flex;gap:10px;max-width:560px;margin-bottom:18px}
.cires{border-radius:var(--r);padding:22px 24px;margin-bottom:22px;max-width:700px;border:2px solid}
.cires.ok{border-color:var(--green);background:rgba(61,220,132,.07)}
.cires.no{border-color:var(--red);background:rgba(255,90,71,.07)}
.cires.warn{border-color:var(--orange);background:rgba(255,157,28,.07)}
.cires .big{font-family:'Big Shoulders Display',Impact,sans-serif;font-weight:900;font-size:44px;text-transform:uppercase;line-height:1}

.tabs{display:flex;gap:0;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{background:none;border:0;border-bottom:4px solid transparent;color:var(--mute);padding:9px 16px;font-weight:600}
.tabs button.on{color:var(--y);border-bottom-color:var(--y)}
.tabs button:hover{color:var(--text)}

/* dialog */
dialog{background:linear-gradient(135deg,rgba(255,226,120,.07),transparent 30%),linear-gradient(180deg,#171717,#090909);color:var(--text);border:1px solid rgba(255,226,120,.22);box-shadow:0 30px 80px rgba(0,0,0,.85),inset 0 1px 0 var(--hi);border-radius:var(--r);padding:0;width:min(560px,94vw);max-height:92vh;overflow:hidden}
dialog.wide{width:min(860px,95vw)}
dialog::backdrop{background:rgba(0,0,0,.78)}
.mi{display:flex;flex-direction:column;max-height:92vh}
.mhd{border-top:2px solid rgba(255,212,0,.85);display:flex;justify-content:space-between;align-items:center;padding:14px 20px 12px;border-bottom:1px solid var(--line)}
.mhd .x{background:none;border:0;color:var(--mute);font-size:26px;line-height:1;padding:0 4px}
.mhd .x:hover{color:var(--y)}
.mbody{padding:18px 20px 20px;overflow-y:auto}
.mact{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#141414;color:var(--y);border:1px solid var(--y);font-weight:700;padding:10px 18px;border-radius:var(--r);z-index:9999;display:none;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.6)}
#toast.err{background:#1a0b09;color:var(--red);border-color:var(--red)}

#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;background:#fff;color:#000;padding:24px;font-family:Arial,sans-serif}
  #printArea *{color:#000!important;background:transparent!important;border-color:#888!important}
  #printArea table{font-size:12px}
  #printArea th,#printArea td{padding:5px 8px;white-space:normal}
  #printArea h1,#printArea h2,#printArea h3{font-family:Arial,sans-serif}
  .rc{max-width:420px;margin:0 auto;border:2px solid #000;padding:18px}
  .rc .l{display:flex;justify-content:space-between;padding:3px 0}
}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:14px 14px 10px}
  .nav{display:flex;overflow-x:auto;padding:0}
  .nav button{width:auto;white-space:nowrap;border-left:0;border-bottom:4px solid transparent;gap:8px}
  .nav button.on{border-bottom-color:var(--y)}
  .side .foot{display:none}
  .main{padding:18px 14px 50px}
  .cols2{grid-template-columns:1fr}
  .g2{grid-template-columns:1fr}
  h1{font-size:32px}
  .hero .side2{text-align:left}
  .stat{border-right:0;padding-left:0;border-bottom:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand">
      <svg width="46" height="46" viewBox="0 0 32 32" aria-hidden="true"><polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="#ffd400"/><circle cx="16" cy="16" r="6" fill="#000"/></svg>
      <div class="nm" id="brandName"></div>
    </div>
    <div class="hazard"></div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="foot">Demo data is stored in this browser only.</div>
  </aside>
  <main class="main" id="main"></main>
</div>

<dialog id="modal">
  <div class="mi">
    <div class="mhd"><h2 id="modalTitle"></h2><button class="x" data-act="closeModal" aria-label="Close">&times;</button></div>
    <div class="mbody" id="modalBody"></div>
  </div>
</dialog>
<div id="toast" role="status"></div>
<div id="printArea"></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const KEY='muscle-mechanic-v1';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const fmtISO=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseISO=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const todayISO=()=>fmtISO(new Date());
const nowTime=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};
const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return fmtISO(d);};
const addMonths=(s,n)=>{const d=parseISO(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return fmtISO(d);};
const diffDays=(a,b)=>Math.round((parseISO(a)-parseISO(b))/86400000);
const fmtDate=s=>s?parseISO(s).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'–';
const money=n=>'₹'+Math.round(Number(n)||0).toLocaleString('en-IN');
const monthLabel=k=>{const a=k.split('-');return new Date(+a[0],+a[1]-1,1).toLocaleDateString('en-IN',{month:'short'});};
const g=id=>document.getElementById(id);
const digits=s=>String(s||'').replace(/\D/g,'');
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- seed data ---------- */
function seed(){
  const rnd=mulberry32(2026), t=todayISO();
  const plans=[
    {id:'p1',name:'1 Month',months:1,price:700,active:true},
    {id:'p3',name:'3 Months',months:3,price:2100,active:true},
    {id:'p6',name:'6 Months',months:6,price:4200,active:true},
    {id:'p12',name:'1 Year',months:12,price:8400,active:true}
  ];
  const offers=[
    {id:'o1',name:'Festive 15% off',desc:'Seasonal offer on long plans',type:'percent',value:15,plans:['p6','p12'],audience:'both',from:addDays(t,-5),to:addDays(t,20),active:true},
    {id:'o2',name:'Zero admission week',desc:'Admission fee waived for new joiners',type:'admission',value:0,plans:[],audience:'new',from:addDays(t,-2),to:addDays(t,5),active:true},
    {id:'o3',name:'Refer a friend: 15 bonus days',desc:'Added on top of the 3 month plan',type:'freedays',value:15,plans:['p3'],audience:'both',from:addDays(t,-30),to:addDays(t,60),active:true},
    {id:'o4',name:'Summer flat ₹300 off',desc:'Ended summer campaign',type:'flat',value:300,plans:['p3','p6'],audience:'both',from:addDays(t,-150),to:addDays(t,-90),active:true}
  ];
  const names=['Arjun Ramesh','Karthik Subramanian','Vignesh Kumar','Suresh Babu','Priya Natarajan','Divya Lakshmi','Mohammed Irfan','Santhosh Raj','Naveen Prakash','Deepak Chandran','Ananya Krishnan','Rahul Venkat','Harish Anand','Lokesh Murugan','Sneha Iyer','Vijay Anand','Gokul Raj','Praveen Kumar','Aravind Selvam','Bharath Narayanan','Kavya Menon','Manoj Kumar','Sathish Kannan','Yuvaraj S','Nithya Shree','Dinesh Karthik','Ashwin Raghavan','Pooja Srinivasan','Tamilselvan R','Faizal Ahmed','Jayanth Gopal','Abishek Raja','Meera Sundaram','Rohit Varma'];
  const female=['Priya','Divya','Ananya','Sneha','Kavya','Nithya','Pooja','Meera'];
  const modes=['Cash','UPI','UPI','Card'];
  const members=[],payments=[],attendance=[];
  let rc=1001;
  names.forEach((n,i)=>{
    const r=rnd();
    const plan=r<.35?plans[0]:r<.6?plans[1]:r<.82?plans[2]:plans[3];
    const back=Math.floor(rnd()*(plan.months*30+25));
    const start=addDays(t,-back);
    const end=addDays(addMonths(start,plan.months),-1);
    const id='MM'+(1001+i);
    const first=n.split(' ')[0];
    const repeat=plan.months<=3&&rnd()<.45;
    let joined=start;
    if(repeat){
      joined=addMonths(start,-plan.months);
      const pe=addDays(addMonths(joined,plan.months),-1);
      payments.push({id:uid('pay'),rc:'',memberId:id,date:joined,kind:'New',planId:plan.id,planName:plan.name,months:plan.months,planPrice:plan.price,admission:1200,discount:0,total:plan.price+1200,paid:plan.price+1200,mode:modes[Math.floor(rnd()*4)],offer:'',offerId:'',start:joined,end:pe});
    }
    const disc=rnd()<.2?Math.round(plan.price*.1):0;
    const adm=repeat?0:1200;
    const total=plan.price+adm-disc;
    const paid=rnd()<.08?total-Math.round(total*.3/50)*50:total;
    payments.push({id:uid('pay'),rc:'',memberId:id,date:start,kind:repeat?'Renewal':'New',planId:plan.id,planName:plan.name,months:plan.months,planPrice:plan.price,admission:adm,discount:disc,total:total,paid:paid,mode:modes[Math.floor(rnd()*4)],offer:disc?'Referral discount':'',offerId:'',start:start,end:end});
    members.push({id:id,name:n,phone:'9'+String(Math.floor(rnd()*1e9)).padStart(9,'0'),email:rnd()<.6?n.toLowerCase().replace(/ /g,'.')+'@example.com':'',gender:female.includes(first)?'Female':'Male',joined:joined,planId:plan.id,start:start,end:end,notes:'',frozenUntil:null});
    if(end>=t){for(let d=0;d<14;d++){if(rnd()<.42)attendance.push({memberId:id,date:addDays(t,-d),time:pad(5+Math.floor(rnd()*15))+':'+pad(Math.floor(rnd()*60))});}}
  });
  payments.sort((a,b)=>a.date<b.date?-1:1).forEach(p=>{p.rc='RC'+(rc++);});
  return {
    settings:{gymName:'MUSCLE MECHANIC',admissionFee:1200,warnDays:7,countryCode:'91',
      msgExpiring:'Hi {name}, this is {gym}. Your {plan} membership ends on {end} ({days} days left). Renew now and keep the streak going!',
      msgExpired:'Hi {name}, your {gym} membership expired on {end}. Come back and renew. Ask at the desk about current offers.',
      msgDue:'Hi {name}, a balance of {due} is pending at {gym}. Please clear it on your next visit. Thank you!'},
    plans,offers,members,payments,attendance
  };
}

const planName=id=>{const p=planById(id);return p?p.name:'–';};
function status(m){
  const t=todayISO();
  if(m.frozenUntil&&t<=m.frozenUntil)return 'Frozen';
  if(m.start>t)return 'Upcoming';
  if(m.end<t)return 'Expired';
  if(diffDays(m.end,t)<=DB.settings.warnDays)return 'Expiring';
  return 'Active';
}
const isLive=s=>s==='Active'||s==='Expiring'||s==='Frozen';
const dueOf=id=>DB.payments.filter(p=>p.memberId===id).reduce((a,p)=>a+(p.total-p.paid),0);
const memberById=id=>DB.members.find(m=>m.id===id);
function nextMemberId(){const n=DB.members.reduce((a,m)=>Math.max(a,parseInt(m.id.replace(/\D/g,''),10)||0),1000);return 'MM'+(n+1);}
function nextRc(){const n=DB.payments.reduce((a,p)=>Math.max(a,parseInt(String(p.rc).replace(/\D/g,''),10)||0),1000);return 'RC'+(n+1);}
function offerState(o){const t=todayISO();if(!o.active)return 'Paused';if(t<o.from)return 'Scheduled';if(t>o.to)return 'Ended';return 'Live';}
function offerApplies(o,planId,isNew){return offerState(o)==='Live'&&(!o.plans.length||o.plans.includes(planId))&&(o.audience==='both'||(o.audience==='new')===isNew);}
function offerText(o){
  const v={percent:o.value+'% off the plan fee',flat:money(o.value)+' off the plan fee',admission:'Admission fee waived',freedays:o.value+' bonus days added'}[o.type];
  return v;
}
function quote(plan,offer,isNew,flag,extra){
  const base=plan.price;
  let adm=isNew?(flag?0:DB.settings.admissionFee):(flag?DB.settings.admissionFee:0);
  let disc=0,bonus=0;
  if(offer){
    if(offer.type==='percent')disc=Math.round(base*offer.value/100);
    else if(offer.type==='flat')disc=Math.min(base,offer.value);
    else if(offer.type==='admission')adm=0;
    else if(offer.type==='freedays')bonus=Number(offer.value)||0;
  }
  extra=Math.max(0,Number(extra)||0);
  return {base,adm,disc,extra,bonus,total:Math.max(0,base+adm-disc-extra)};
}
function fillMsg(tpl,m,extra){
  const end=m?fmtDate(m.end):'';
  const days=m?diffDays(m.end,todayISO()):0;
  return String(tpl).replace(/\{(\w+)\}/g,(x,k)=>{
    const map={name:m?m.name.split(' ')[0]:'',gym:DB.settings.gymName,end:end,days:days,plan:m?planName(m.planId):'',due:m?money(dueOf(m.id)):''};
    return k in map?map[k]:x;
  });
}

  const order={Live:0,Scheduled:1,Paused:2,Ended:3};
  const list=DB.offers.slice().sort((a,b)=>order[offerState(a)]-order[offerState(b)]);
  const body=list.length?list.map(o=>{
    const s=offerState(o),uses=DB.payments.filter(p=>p.offerId===o.id).length;
    const pl=o.plans.length?o.plans.map(planName).join(', '):'all plans';
    const aud={both:'new and renewing members',new:'new members only',renewal:'renewals only'}[o.audience];
    return '<div class="offer '+s.toLowerCase()+'"><div><h3>'+esc(o.name)+' '+chip(s)+'</h3><div style="margin-top:6px"><b>'+esc(offerText(o))+'</b> on '+esc(pl)+' for '+aud+'</div><div class="meta">'+fmtDate(o.from)+' to '+fmtDate(o.to)+' · used '+uses+' time'+(uses===1?'':'s')+(o.desc?' · '+esc(o.desc):'')+'</div></div><div class="row"><button class="btn sm" data-act="editOffer" data-id="'+o.id+'">Edit</button><button class="btn sm" data-act="toggleOffer" data-id="'+o.id+'">'+(o.active?'Pause':'Resume')+'</button><button class="btn sm" data-act="dupOffer" data-id="'+o.id+'">Duplicate</button><button class="btn danger sm" data-act="delOffer" data-id="'+o.id+'">Delete</button></div></div>';}).join(''):'<div class="empty">No offers yet. Create one to run a campaign.</div>';
  return head('Run festival deals, joining fee waivers and bonus days')+'<div class="bar2"><button class="btn primary" data-act="newOffer">+ New offer</button></div>'+body;
}

/* reports */
function rangeDates(){
  const t=todayISO(),d=parseISO(t);let from=t,to=t;
  switch(UI.range){
    case 'today':break;
    case 'month':from=t.slice(0,8)+'01';break;
    case 'last':from=fmtISO(new Date(d.getFullYear(),d.getMonth()-1,1));to=fmtISO(new Date(d.getFullYear(),d.getMonth(),0));break;
    case '3m':from=addMonths(t,-3);break;
    case 'year':from=d.getFullYear()+'-01-01';break;
    case 'all':from='2000-01-01';break;
    case 'custom':from=UI.from||'2000-01-01';to=UI.to||t;break;
  }
  return {from:from,to:to};
}
function buildReport(tab){
  const t=todayISO(),R=rangeDates();
  const inR=d=>d>=R.from&&d<=R.to;
  if(tab==='collections'){
    const ps=DB.payments.filter(p=>inR(p.date)).sort((a,b)=>a.date<b.date?1:-1);
    const sum=f=>ps.reduce((a,p)=>a+f(p),0);
    const by=(f)=>{const o={};ps.forEach(p=>{const k=f(p);o[k]=(o[k]||0)+p.paid;});return Object.keys(o).map(k=>'<div class="li"><span>'+esc(k)+'</span><b>'+money(o[k])+'</b></div>').join('')||'<div class="hint">No data</div>';};
    return {title:'Collections',
      summary:[['Collected',money(sum(p=>p.paid))],['Billed',money(sum(p=>p.total))],['Admission fees',money(sum(p=>Math.min(p.admission,p.paid)))],['Discounts given',money(sum(p=>p.discount))],['New admissions',ps.filter(p=>p.kind==='New').length],['Renewals',ps.filter(p=>p.kind==='Renewal').length]],
      extra:'<div class="cols2" style="grid-template-columns:1fr 1fr"><div class="panel"><h3>By plan</h3>'+by(p=>p.planName)+'</div><div class="panel"><h3>By payment mode</h3>'+by(p=>p.mode)+'</div></div>',
      columns:['Date','Receipt','Member','Type','Plan','Billed','Discount','Paid','Mode'],
      rows:ps.map(p=>{const m=memberById(p.memberId);return [fmtDate(p.date),p.rc,m?m.name:'Deleted member',p.kind,p.planName,mc(p.total),mc(p.discount),mc(p.paid),p.mode];}),num:['Billed','Discount','Paid']};
  }
  if(tab==='memberships'){
    const ms=DB.members.filter(m=>inR(m.joined)).sort((a,b)=>a.joined<b.joined?1:-1);
    const live=DB.members.filter(m=>isLive(status(m)));
    const f=live.filter(m=>m.gender==='Female').length;
    return {title:'Memberships',
      summary:[['Joined in range',ms.length],['Active now',live.length],['All time members',DB.members.length],['Women / men (active)',f+' / '+(live.length-f)]],
      extra:'',columns:['Joined','ID','Member','Phone','Plan','Ends','Status'],
      rows:ms.map(m=>[fmtDate(m.joined),m.id,m.name,m.phone,planName(m.planId),fmtDate(m.end),{t:status(m),c:status(m).toLowerCase()}]),num:[]};
  }
  if(tab==='expiry'){
    const rows=DB.members.map(m=>({m:m,s:status(m),d:diffDays(m.end,t)})).filter(r=>r.d>=-30&&r.d<=30&&r.s!=='Upcoming').sort((a,b)=>a.d-b.d);
    return {title:'Expiry and lapsed',
      summary:[['Expiring in 7 days',rows.filter(r=>r.d>=0&&r.d<=7).length],['Expiring in 30 days',rows.filter(r=>r.d>=0).length],['Lapsed in last 30 days',rows.filter(r=>r.d<0).length]],
      extra:'<div class="hint" style="margin-bottom:10px">Shows members whose end date falls within 30 days before or after today.</div>',
      columns:['ID','Member','Phone','Plan','End date','Days left','Status'],
      rows:rows.map(r=>[r.m.id,r.m.name,r.m.phone,planName(r.m.planId),fmtDate(r.m.end),r.d,{t:r.s,c:r.s.toLowerCase()}]),num:['Days left']};
  }
  if(tab==='dues'){
    const rows=DB.members.map(m=>({m:m,due:dueOf(m.id),bill:DB.payments.filter(p=>p.memberId===m.id).reduce((a,p)=>a+p.total,0)})).filter(r=>r.due>0).sort((a,b)=>b.due-a.due);
    return {title:'Pending dues',
      summary:[['Members with dues',rows.length],['Total pending',money(rows.reduce((a,r)=>a+r.due,0))]],extra:'',
      columns:['ID','Member','Phone','Billed','Paid','Due'],
      rows:rows.map(r=>[r.m.id,r.m.name,r.m.phone,mc(r.bill),mc(r.bill-r.due),mc(r.due)]),num:['Billed','Paid','Due']};
  }
  const o={};
  DB.payments.filter(p=>inR(p.date)&&(p.offer||p.discount>0)).forEach(p=>{const k=p.offer||'Manual discount';o[k]=o[k]||{n:0,d:0,r:0};o[k].n++;o[k].d+=p.discount;o[k].r+=p.paid;});
  const keys=Object.keys(o);
  return {title:'Offer performance',summary:[['Offers used',keys.reduce((a,k)=>a+o[k].n,0)],['Discount given',money(keys.reduce((a,k)=>a+o[k].d,0))]],extra:'',
    columns:['Offer','Uses','Discount given','Collected'],rows:keys.map(k=>[k,o[k].n,mc(o[k].d),mc(o[k].r)]),num:['Uses','Discount given','Collected']};
}
function reportHTML(rep){
  const cell=(c,right)=>{if(c&&typeof c==='object'){return '<td class="'+(right?'num':'')+'">'+(c.c?chip(c.t).replace('chip '+c.c,'chip '+c.c):esc(c.t))+'</td>';}return '<td class="'+(right?'num':'')+'">'+esc(c)+'</td>';};
  return '<div class="stats">'+rep.summary.map(s=>'<div class="stat"><div class="v">'+esc(s[1])+'</div><div class="k">'+esc(s[0])+'</div></div>').join('')+'</div>'+rep.extra+
    (rep.rows.length?'<div class="tw"><table><thead><tr>'+rep.columns.map(c=>'<th class="'+(rep.num.includes(c)?'num':'')+'">'+c+'</th>').join('')+'</tr></thead><tbody>'+rep.rows.map(r=>'<tr>'+r.map((c,i)=>cell(c,rep.num.includes(rep.columns[i]))).join('')+'</tr>').join('')+'</tbody></table></div>':'<div class="empty">Nothing to show for this period.</div>');
}
function reports(){
  const tabs=[['collections','Collections'],['memberships','Memberships'],['expiry','Expiry'],['dues','Dues'],['offers','Offers']];
  const rg=[['today','Today'],['month','This month'],['last','Last month'],['3m','Last 3 months'],['year','This year'],['all','All time'],['custom','Custom']];
  const showRange=UI.rep==='collections'||UI.rep==='memberships'||UI.rep==='offers';
  return head('Revenue, member and expiry reports')+
  '<div class="tabs">'+tabs.map(x=>'<button class="'+(UI.rep===x[0]?'on':'')+'" data-act="repTab" data-id="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>'+
  '<div class="bar2">'+(showRange?'<select id="rrange" aria-label="Date range">'+rg.map(x=>'<option value="'+x[0]+'"'+(UI.range===x[0]?' selected':'')+'>'+x[1]+'</option>').join('')+'</select>'+(UI.range==='custom'?'<input type="date" id="rfrom" style="width:auto" value="'+esc(UI.from)+'" aria-label="From date"><input type="date" id="rto" style="width:auto" value="'+esc(UI.to)+'" aria-label="To date">':''):'')+
  '<span style="flex:1"></span><button class="btn" data-act="repCsv">Export CSV</button><button class="btn" data-act="repPrint">Print</button></div><div id="rbody">'+reportHTML(buildReport(UI.rep))+'</div>';
}
function afterReports(){
  const r=g('rrange');if(r)r.onchange=e=>{UI.range=e.target.value;render();};
  const f=g('rfrom'),t=g('rto');
  if(f)f.onchange=e=>{UI.from=e.target.value;g('rbody').innerHTML=reportHTML(buildReport(UI.rep));};
  if(t)t.onchange=e=>{UI.to=e.target.value;g('rbody').innerHTML=reportHTML(buildReport(UI.rep));};
}

/* ---------- purchase (new member / renew) ---------- */
function openPurchase(mid){
  const m=mid?memberById(mid):null,isNew=!m;
  const pls=DB.plans.filter(p=>p.active).sort((a,b)=>a.months-b.months);
  if(!pls.length){toast('Turn on at least one plan first','err');return;}
  const t=todayISO();
  const dp=m?(pls.find(p=>p.id===m.planId)||pls[0]):pls[0];
  const dstart=m?(m.end>=t?addDays(m.end,1):t):t;
  const who=isNew?
    '<div class="g2"><div><label for="f-name">Full name</label><input id="f-name" autocomplete="off"></div><div><label for="f-phone">Phone</label><input id="f-phone" inputmode="numeric" placeholder="10 digit mobile"></div></div>'+
    '<div class="g2"><div><label for="f-email">Email (optional)</label><input id="f-email" type="email"></div><div><label for="f-gender">Gender</label><select id="f-gender"><option>Male</option><option>Female</option><option>Other</option></select></div></div>'
    :'<div class="sum" style="margin-top:0"><div class="l"><span>Member</span><b>'+esc(m.name)+' · '+esc(m.id)+'</b></div><div class="l"><span>Current plan ends</span><b>'+fmtDate(m.end)+'</b></div></div>';
  openModal(isNew?'New membership':'Renew membership',
    who+
    '<div class="g2"><div><label for="f-plan">Plan</label><select id="f-plan">'+pls.map(p=>'<option value="'+p.id+'"'+(p.id===dp.id?' selected':'')+'>'+esc(p.name)+' · '+money(p.price)+'</option>').join('')+'</select></div><div><label for="f-start">Starts on</label><input type="date" id="f-start" value="'+dstart+'"></div></div>'+
    '<div class="g2"><div><label for="f-offer">Offer</label><select id="f-offer"></select></div><div><label for="f-extra">Extra discount (₹)</label><input type="number" min="0" id="f-extra" value="0"></div></div>'+
    '<div class="g1"><label class="chk"><input type="checkbox" id="f-flag"> '+(isNew?'Waive admission fee for this member':'Charge admission fee again (returning after a long break)')+'</label></div>'+
    '<div id="f-sum" class="sum"></div>'+
    '<div class="g2"><div><label for="f-mode">Payment mode</label><select id="f-mode"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank transfer</option></select></div><div><label for="f-paid">Amount received now (₹)</label><input type="number" min="0" id="f-paid"></div></div>'+
    '<div class="mact"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="savePurchase" data-id="'+(mid||'')+'">'+(isNew?'Add member and take payment':'Renew and take payment')+'</button></div>');
  let paidDirty=false;
  function buildOffers(){
    const sel=g('f-offer'),keep=sel.value,pid=g('f-plan').value;
    const ok=DB.offers.filter(o=>offerApplies(o,pid,isNew));
    sel.innerHTML='<option value="">No offer</option>'+ok.map(o=>'<option value="'+o.id+'">'+esc(o.name)+' ('+esc(offerText(o))+')</option>').join('');
    if(ok.some(o=>o.id===keep))sel.value=keep;
  }
  function recalc(e){
    if(e&&e.target&&e.target.id==='f-paid')paidDirty=true;
    if(e&&e.target&&e.target.id==='f-plan')buildOffers();
    const r=readPurchase(isNew);
    if(!r)return;
    const q=r.q;
    g('f-sum').innerHTML=
      '<div class="l"><span>Plan fee ('+esc(r.plan.name)+')</span><b>'+money(q.base)+'</b></div>'+
      '<div class="l"><span>Admission fee</span><b>'+(q.adm?money(q.adm):'None')+'</b></div>'+
      (q.disc?'<div class="l"><span>Offer discount</span><b>- '+money(q.disc)+'</b></div>':'')+
      (q.extra?'<div class="l"><span>Extra discount</span><b>- '+money(q.extra)+'</b></div>':'')+
      '<div class="l"><span>Membership runs</span><b>'+fmtDate(r.start)+' to '+fmtDate(r.end)+(q.bonus?' (+'+q.bonus+' bonus days)':'')+'</b></div>'+
      '<div class="l t"><span>Total payable</span><b>'+money(q.total)+'</b></div>';
    if(!paidDirty)g('f-paid').value=q.total;
  }
  buildOffers();recalc();
  g('modalBody').oninput=recalc;g('modalBody').onchange=recalc;
  setTimeout(()=>{const f=g(isNew?'f-name':'f-plan');if(f)f.focus();},30);
}
function readPurchase(isNew){
  const plan=planById(g('f-plan').value);
  if(!plan)return null;
  const start=g('f-start').value||todayISO();
  const offer=DB.offers.find(o=>o.id===g('f-offer').value)||null;
  const q=quote(plan,offer,isNew,g('f-flag').checked,g('f-extra').value);
  const end=addDays(addDays(addMonths(start,plan.months),-1),q.bonus);
  return {plan:plan,offer:offer,q:q,start:start,end:end};
}
function savePurchase(mid){
  const m=mid?memberById(mid):null,isNew=!m;
  const r=readPurchase(isNew);if(!r)return;
  let name,phone;
  if(isNew){
    name=g('f-name').value.trim();phone=digits(g('f-phone').value).slice(-10);
    if(!name){toast('Enter the member name','err');return;}
    if(phone.length!==10){toast('Enter a 10 digit phone number','err');return;}
    if(DB.members.some(x=>x.phone===phone)){toast('A member with this phone number already exists','err');return;}
  }
  const paid=Math.max(0,Number(g('f-paid').value)||0);
  if(paid>r.q.total){toast('Amount received is more than the total payable','err');return;}
  let member=m;
  if(isNew){
    member={id:nextMemberId(),name:name,phone:phone,email:g('f-email').value.trim(),gender:g('f-gender').value,joined:r.start,planId:r.plan.id,start:r.start,end:r.end,notes:'',frozenUntil:null};
    DB.members.push(member);
  }else{
    member.planId=r.plan.id;member.start=r.start;member.end=r.end;
  }
  const pay={id:uid('pay'),rc:nextRc(),memberId:member.id,date:todayISO(),kind:isNew?'New':'Renewal',planId:r.plan.id,planName:r.plan.name,months:r.plan.months,planPrice:r.q.base,admission:r.q.adm,discount:r.q.disc+r.q.extra,total:r.q.total,paid:paid,mode:g('f-mode').value,offer:r.offer?r.offer.name:(r.q.extra?'Manual discount':''),offerId:r.offer?r.offer.id:'',start:r.start,end:r.end};
  DB.payments.push(pay);save();
  closeModal();render();
  const bal=pay.total-pay.paid;
  openModal('Payment recorded',
    '<div class="sum" style="margin-top:0"><div class="l"><span>Member</span><b>'+esc(member.name)+' · '+esc(member.id)+'</b></div><div class="l"><span>Plan</span><b>'+esc(pay.planName)+'</b></div><div class="l"><span>Valid</span><b>'+fmtDate(pay.start)+' to '+fmtDate(pay.end)+'</b></div><div class="l"><span>Receipt</span><b>'+esc(pay.rc)+'</b></div><div class="l t"><span>Received</span><b>'+money(pay.paid)+'</b></div>'+(bal>0?'<div class="l"><span>Balance due</span><b style="color:var(--orange)">'+money(bal)+'</b></div>':'')+'</div>'+
    '<div class="mact"><a class="btn wa" target="_blank" rel="noopener" href="'+waLink(member,'Hi {name}, thank you for joining {gym}! Payment of '+money(pay.paid)+' received (receipt '+pay.rc+'). Your {plan} membership is valid till {end}.')+'">Send on WhatsApp</a><button class="btn" data-act="receipt" data-id="'+pay.id+'">Print receipt</button><button class="btn primary" data-act="closeModal">Done</button></div>');
}

   '<div class="row" style="margin-bottom:6px">'+chip(s)+'<span class="hint">'+esc(m.id)+' · '+esc(m.phone)+(m.email?' · '+esc(m.email):'')+' · '+esc(m.gender)+'</span></div>'+
   '<div class="kv"><div><span>Plan</span><b>'+esc(planName(m.planId))+'</b></div><div><span>Current period</span><b>'+fmtDate(m.start)+' to '+fmtDate(m.end)+'</b></div><div><span>Days left</span><b>'+Math.max(0,diffDays(m.end,t))+'</b></div><div><span>Member since</span><b>'+fmtDate(m.joined)+'</b></div><div><span>Visits (30 days)</span><b>'+last30+'</b></div><div><span>Last visit</span><b>'+(last?fmtDate(last.date):'–')+'</b></div><div><span>Pending due</span><b style="color:'+(due>0?'var(--orange)':'inherit')+'">'+money(due)+'</b></div></div>'+
   (m.notes?'<div class="hint" style="margin-bottom:12px">Notes: '+esc(m.notes)+'</div>':'')+
   '<div class="row" style="margin-bottom:16px"><button class="btn primary" data-act="renew" data-id="'+id+'">Renew</button><button class="btn" data-act="editMember" data-id="'+id+'">Edit</button>'+
   (s==='Frozen'?'<button class="btn" data-act="unfreeze" data-id="'+id+'">Unfreeze</button>':(isLive(s)?'<button class="btn" data-act="freeze" data-id="'+id+'">Freeze</button>':''))+
   (due>0?'<button class="btn" data-act="collect" data-id="'+id+'">Collect due</button>':'')+
   '<button class="btn" data-act="checkinNow" data-id="'+id+'">Check in now</button><a class="btn wa" target="_blank" rel="noopener" href="'+waLink(m,s==='Expired'?DB.settings.msgExpired:DB.settings.msgExpiring)+'">WhatsApp</a><button class="btn danger" data-act="delMember" data-id="'+id+'">Delete</button></div>'+
   '<h3 style="margin-bottom:8px">Payments</h3>'+(pays.length?'<div class="tw"><table><thead><tr><th>Date</th><th>Receipt</th><th>Type</th><th>Plan</th><th class="num">Paid</th><th></th></tr></thead><tbody>'+pays.map(p=>'<tr><td>'+fmtDate(p.date)+'</td><td>'+esc(p.rc)+'</td><td>'+esc(p.kind)+'</td><td>'+esc(p.planName)+'</td><td class="num">'+money(p.paid)+'</td><td><button class="btn sm" data-act="receipt" data-id="'+p.id+'">Receipt</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No payments yet.</div>'),true);
}
function openEdit(id){
  const m=memberById(id);
  openModal('Edit member',
   '<div class="g2"><div><label for="e-name">Name</label><input id="e-name" value="'+esc(m.name)+'"></div><div><label for="e-phone">Phone</label><input id="e-phone" value="'+esc(m.phone)+'"></div></div>'+
   '<div class="g2"><div><label for="e-email">Email</label><input id="e-email" value="'+esc(m.email)+'"></div><div><label for="e-gender">Gender</label><select id="e-gender">'+['Male','Female','Other'].map(x=>'<option'+(m.gender===x?' selected':'')+'>'+x+'</option>').join('')+'</select></div></div>'+
   '<div class="g2"><div><label for="e-start">Period start</label><input type="date" id="e-start" value="'+m.start+'"></div><div><label for="e-end">Period end</label><input type="date" id="e-end" value="'+m.end+'"></div></div>'+
   '<div class="g1"><label for="e-plan">Plan</label><select id="e-plan">'+DB.plans.map(p=>'<option value="'+p.id+'"'+(p.id===m.planId?' selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select></div>'+
   '<div class="g1"><label for="e-notes">Notes</label><textarea id="e-notes">'+esc(m.notes)+'</textarea></div>'+
   '<div class="mact"><button class="btn" data-act="profile" data-id="'+id+'">Cancel</button><button class="btn primary" data-act="saveEdit" data-id="'+id+'">Save changes</button></div>');
}
function openFreeze(id){
  const m=memberById(id);
  openModal('Freeze membership',
   '<p class="hint" style="margin-top:0">'+esc(m.name)+' will not be able to check in while frozen. The end date moves forward by the same number of days.</p>'+
   '<div class="g1"><label for="z-days">Freeze for (days)</label><input type="number" min="1" max="90" id="z-days" value="15"></div>'+
   '<div class="mact"><button class="btn" data-act="profile" data-id="'+id+'">Cancel</button><button class="btn primary" data-act="saveFreeze" data-id="'+id+'">Freeze</button></div>');
}
function openCollect(id){
  const m=memberById(id),due=dueOf(id);
  openModal('Collect pending due',
   '<div class="sum" style="margin-top:0"><div class="l"><span>Member</span><b>'+esc(m.name)+'</b></div><div class="l t"><span>Pending</span><b>'+money(due)+'</b></div></div>'+
   '<div class="g2"><div><label for="c-amt">Amount received (₹)</label><input type="number" min="1" max="'+due+'" id="c-amt" value="'+due+'"></div><div><label for="c-mode">Payment mode</label><select id="c-mode"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank transfer</option></select></div></div>'+
   '<div class="mact"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="saveCollect" data-id="'+id+'">Record payment</button></div>');
}
function openPlan(id){
  const p=id?planById(id):{name:'',months:1,price:DB.plans.length?Math.round((DB.plans.find(x=>x.months===1)||{price:700}).price):700,active:true};
  openModal(id?'Edit plan':'New plan',
   '<div class="g1"><label for="pl-name">Plan name</label><input id="pl-name" value="'+esc(p.name)+'" placeholder="e.g. 2 Months"></div>'+
   '<div class="g2"><div><label for="pl-months">Duration (months)</label><input type="number" min="1" max="36" id="pl-months" value="'+p.months+'"></div><div><label for="pl-price">Price (₹)</label><input type="number" min="0" id="pl-price" value="'+p.price+'"></div></div>'+
   '<div class="g1"><label class="chk"><input type="checkbox" id="pl-active"'+(p.active?' checked':'')+'> Available for new sign ups</label></div>'+
   '<div class="mact"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="savePlan" data-id="'+(id||'')+'">Save plan</button></div>');
}
function openOffer(id,dup){
  const t=todayISO();
  const o=id?DB.offers.find(x=>x.id===id):{name:'',desc:'',type:'percent',value:10,plans:[],audience:'both',from:t,to:addDays(t,14),active:true};
  const name=dup?o.name+' (copy)':o.name;
  openModal(id&&!dup?'Edit offer':'New offer',
   '<div class="g1"><label for="of-name">Offer name</label><input id="of-name" value="'+esc(name)+'" placeholder="e.g. New Year 20% off"></div>'+
   '<div class="g1"><label for="of-desc">Note (optional)</label><input id="of-desc" value="'+esc(o.desc)+'"></div>'+
   '<div class="g2"><div><label for="of-type">Offer type</label><select id="of-type">'+[['percent','Percentage off plan fee'],['flat','Flat ₹ off plan fee'],['admission','Waive admission fee'],['freedays','Bonus free days']].map(x=>'<option value="'+x[0]+'"'+(o.type===x[0]?' selected':'')+'>'+x[1]+'</option>').join('')+'</select></div><div><label for="of-value">Value</label><input type="number" min="0" id="of-value" value="'+o.value+'"></div></div>'+
   '<div class="g1"><label>Applies to plans (none ticked means all plans)</label><div class="row">'+DB.plans.map(p=>'<label class="chk"><input type="checkbox" class="of-plan" value="'+p.id+'"'+(o.plans.includes(p.id)?' checked':'')+'> '+esc(p.name)+'</label>').join('')+'</div></div>'+
   '<div class="g2"><div><label for="of-aud">For</label><select id="of-aud">'+[['both','New and renewing'],['new','New members only'],['renewal','Renewals only']].map(x=>'<option value="'+x[0]+'"'+(o.audience===x[0]?' selected':'')+'>'+x[1]+'</option>').join('')+'</select></div><div></div></div>'+
   '<div class="g2"><div><label for="of-from">Starts</label><input type="date" id="of-from" value="'+o.from+'"></div><div><label for="of-to">Ends</label><input type="date" id="of-to" value="'+o.to+'"></div></div>'+
   '<div class="mact"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="saveOffer" data-id="'+(id&&!dup?id:'')+'">Save offer</button></div>');
}
function openBulk(){
  openModal('Change all prices',
   '<p class="hint" style="margin-top:0">Raise or lower every plan price by a percentage. Use a negative number to reduce. Prices round to the nearest ₹10.</p>'+
   '<div class="g1"><label for="b-pct">Change (%)</label><input type="number" id="b-pct" value="5"></div>'+
   '<div class="mact"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="saveBulk">Apply to all plans</button></div>');
}

/* ---------- actions ---------- */
const ACTIONS={
  closeModal:closeModal,
  go:id=>{UI.view=id;closeModal();render();window.scrollTo(0,0);},
  goMembers:id=>{UI.view='members';UI.fStatus=id;UI.q='';UI.fPlan='all';render();window.scrollTo(0,0);},
  newMember:()=>openPurchase(null),
  renew:id=>openPurchase(id),
  savePurchase:id=>savePurchase(id),
  receipt:id=>receipt(id),
  profile:id=>openProfile(id),
  editMember:id=>openEdit(id),
  saveEdit:id=>{
    const m=memberById(id),name=g('e-name').value.trim(),phone=digits(g('e-phone').value).slice(-10);
    if(!name){toast('Enter the member name','err');return;}
    if(phone.length!==10){toast('Enter a 10 digit phone number','err');return;}
    if(DB.members.some(x=>x.id!==id&&x.phone===phone)){toast('Another member already uses this phone number','err');return;}
    if(g('e-end').value<g('e-start').value){toast('End date cannot be before the start date','err');return;}
    Object.assign(m,{name:name,phone:phone,email:g('e-email').value.trim(),gender:g('e-gender').value,start:g('e-start').value,end:g('e-end').value,planId:g('e-plan').value,notes:g('e-notes').value.trim()});
    save();render();openProfile(id);toast('Member updated');
  },
  freeze:id=>openFreeze(id),
  saveFreeze:id=>{
    const d=Math.floor(Number(g('z-days').value));
    if(!(d>=1)){toast('Enter the number of days','err');return;}
    const m=memberById(id);m.frozenUntil=addDays(todayISO(),d);m.end=addDays(m.end,d);save();render();openProfile(id);toast('Frozen for '+d+' days. End date extended.');
  },
  unfreeze:id=>{
    const m=memberById(id),rem=Math.max(0,diffDays(m.frozenUntil,todayISO()));
    m.end=addDays(m.end,-rem);m.frozenUntil=null;save();render();openProfile(id);toast('Membership resumed');
  },
  collect:id=>openCollect(id),
  saveCollect:id=>{
    const due=dueOf(id),amt=Number(g('c-amt').value)||0;
    if(amt<=0||amt>due){toast('Enter an amount up to '+money(due),'err');return;}
    const m=memberById(id);
    const pay={id:uid('pay'),rc:nextRc(),memberId:id,date:todayISO(),kind:'Due payment',planId:m.planId,planName:planName(m.planId),months:0,planPrice:0,admission:0,discount:0,total:0,paid:amt,mode:g('c-mode').value,offer:'',offerId:'',start:'',end:''};
    DB.payments.push(pay);save();render();openProfile(id);toast('Collected '+money(amt));
  },
  checkinNow:id=>{const m=memberById(id);const s=status(m);if(!isLive(s)||s==='Frozen'){toast('Cannot check in: membership is '+s.toLowerCase(),'err');return;}if(DB.attendance.some(a=>a.memberId===id&&a.date===todayISO())){toast('Already checked in today');return;}DB.attendance.push({memberId:id,date:todayISO(),time:nowTime()});save();render();openProfile(id);toast('Checked in');},
  delMember:id=>{const m=memberById(id);if(!confirm('Delete '+m.name+' and their attendance? Payment history stays in reports.'))return;DB.members=DB.members.filter(x=>x.id!==id);DB.attendance=DB.attendance.filter(a=>a.memberId!==id);save();closeModal();render();toast('Member deleted');},
  sort:k=>{if(UI.sort===k)UI.dir*=-1;else{UI.sort=k;UI.dir=1;}g('mtable').innerHTML=membersTable();},
  exportMembers:()=>{const t=todayISO();download('members-'+t+'.csv',csv(['ID','Name','Phone','Email','Gender','Plan','Start','End','Status','Due'],DB.members.map(m=>[m.id,m.name,m.phone,m.email,m.gender,planName(m.planId),m.start,m.end,status(m),dueOf(m.id)])),'text/csv');},
  exportPayments:()=>{download('payments-'+todayISO()+'.csv',csv(['Receipt','Date','Member ID','Type','Plan','Plan price','Admission','Discount','Total','Paid','Mode','Offer'],DB.payments.map(p=>[p.rc,p.date,p.memberId,p.kind,p.planName,p.planPrice,p.admission,p.discount,p.total,p.paid,p.mode,p.offer])),'text/csv');},
  doCheckin:()=>{
    const q=g('ciq').value.trim().toLowerCase();if(!q)return;
    const dq=digits(q);
    let hits=DB.members.filter(m=>m.id.toLowerCase()===q||(dq.length>=4&&m.phone.endsWith(dq)));
    if(!hits.length)hits=DB.members.filter(m=>m.name.toLowerCase().includes(q));
    const box=g('cires');
    if(!hits.length){UI.lastCheck='<div class="cires no"><div class="big">Not found</div><div class="hint" style="margin-top:8px">No member matches that. Check the ID or number, or add a new member.</div></div>';}
    else if(hits.length>1){UI.lastCheck='<div class="panel" style="margin-bottom:22px"><h3>Several matches</h3>'+hits.slice(0,8).map(m=>'<div class="li"><span><b>'+esc(m.name)+'</b> · '+esc(m.id)+'</span><button class="btn primary sm" data-act="checkinId" data-id="'+m.id+'">Check in</button></div>').join('')+'</div>';}
    else{UI.lastCheck=checkinCard(hits[0]);g('ciq').value='';}
    render();
  },
  checkinId:id=>{UI.lastCheck=checkinCard(memberById(id));render();},
  saveAdm:()=>{const v=Number(g('adm').value);if(!(v>=0)){toast('Enter a valid fee','err');return;}DB.settings.admissionFee=Math.round(v);save();toast('Admission fee set to '+money(v));},
  newPlan:()=>openPlan(null),
  editPlan:id=>openPlan(id),
  savePlan:id=>{
    const name=g('pl-name').value.trim(),months=Math.floor(Number(g('pl-months').value)),price=Number(g('pl-price').value);
    if(!name){toast('Enter a plan name','err');return;}
    if(!(months>=1)){toast('Duration must be at least 1 month','err');return;}
    if(!(price>=0)){toast('Enter a valid price','err');return;}
    const act=g('pl-active').checked;
    if(id){Object.assign(planById(id),{name:name,months:months,price:price,active:act});}
    else DB.plans.push({id:uid('p'),name:name,months:months,price:price,active:act});
    save();closeModal();render();toast('Plan saved');
  },
  togglePlan:id=>{const p=planById(id);p.active=!p.active;save();render();},
  delPlan:id=>{
    if(DB.members.some(m=>m.planId===id)){toast('Members use this plan. Turn it off instead.','err');return;}
    if(!confirm('Delete this plan?'))return;DB.plans=DB.plans.filter(p=>p.id!==id);save();render();
  },
  bulkPrice:openBulk,
  saveBulk:()=>{const pct=Number(g('b-pct').value);if(!isFinite(pct)){toast('Enter a percentage','err');return;}DB.plans.forEach(p=>{p.price=Math.max(0,Math.round(p.price*(1+pct/100)/10)*10);});save();closeModal();render();toast('Prices updated by '+pct+'%');},
  newOffer:()=>openOffer(null),
  editOffer:id=>openOffer(id),
  dupOffer:id=>openOffer(id,true),
  saveOffer:id=>{
    const name=g('of-name').value.trim(),type=g('of-type').value,value=Number(g('of-value').value)||0;
    if(!name){toast('Name the offer','err');return;}
    if((type==='percent'&&(value<=0||value>100))){toast('Percentage must be between 1 and 100','err');return;}
    if((type==='flat'||type==='freedays')&&value<=0){toast('Enter a value above 0','err');return;}
    if(g('of-to').value<g('of-from').value){toast('End date is before the start date','err');return;}
    const o={name:name,desc:g('of-desc').value.trim(),type:type,value:type==='admission'?0:value,plans:$$('.of-plan:checked').map(x=>x.value),audience:g('of-aud').value,from:g('of-from').value,to:g('of-to').value,active:true};
    if(id){Object.assign(DB.offers.find(x=>x.id===id),o);}else{o.id=uid('o');DB.offers.push(o);}
    save();closeModal();render();toast('Offer saved');
  },
  toggleOffer:id=>{const o=DB.offers.find(x=>x.id===id);o.active=!o.active;save();render();},
  delOffer:id=>{if(!confirm('Delete this offer? Past payments keep their record.'))return;DB.offers=DB.offers.filter(o=>o.id!==id);save();render();},
  repTab:id=>{UI.rep=id;render();},
  repCsv:()=>{const r=buildReport(UI.rep);download('report-'+UI.rep+'-'+todayISO()+'.csv',csv(r.columns,r.rows),'text/csv');},
  repPrint:()=>{const r=buildReport(UI.rep),R=rangeDates();printHTML('<h2>'+esc(DB.settings.gymName)+'</h2><h3>'+esc(r.title)+'</h3><div style="margin-bottom:10px">'+fmtDate(R.from)+' to '+fmtDate(R.to)+'</div>'+reportHTML(r));},
  backup:()=>download('muscle-mechanic-backup-'+todayISO()+'.json',JSON.stringify(DB,null,2),'application/json'),
  restore:()=>g('importFile').click(),
  resetDemo:()=>{if(!confirm('Replace everything with fresh demo data?'))return;DB=seed();save();render();toast('Demo data restored');},
  clearAll:()=>{if(!confirm('Delete all members, payments and check-ins? Plans, offers and settings stay.'))return;DB.members=[];DB.payments=[];DB.attendance=[];save();render();toast('All members cleared');}
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const f=ACTIONS[el.dataset.act];if(f){e.preventDefault();f(el.dataset.id,el);}
});
document.addEventListener('change',e=>{
  const k=e.target.dataset&&e.target.dataset.setting;if(!k)return;
  let v=e.target.value;
  if(k==='admissionFee'||k==='warnDays'){v=Math.max(k==='warnDays'?1:0,Math.round(Number(v)||0));e.target.value=v;}
  if(k==='gymName'&&!v.trim()){toast('Gym name cannot be empty','err');e.target.value=DB.settings.gymName;return;}
  if(k==='countryCode')v=digits(v)||'91';
  DB.settings[k]=v;save();
  const nm=DB.settings.gymName.trim().split(/\s+/),first=nm.shift();
  g('brandName').innerHTML='<span>'+esc(first)+'</span>'+(nm.length?'<span class="y">'+esc(nm.join(' '))+'</span>':'');
  toast('Saved');
});
g('importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!d.members||!d.plans||!d.settings||!d.payments)throw 0;DB=d;if(!DB.offers)DB.offers=[];if(!DB.attendance)DB.attendance=[];save();render();toast('Backup restored');}catch(x){toast('That file is not a valid backup','err');}e.target.value='';};
  r.readAsText(f);
});

render();
})();
</script>
</body>
</html>
